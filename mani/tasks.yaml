tasks:
  sync:
    desc: "Update reference repos (safe for local-only repos) and register to Gita"
    spec:
      parallel: true
    cmd: |
      REPO_NAME="$(basename "$PWD")"

      # 1. Switch to default branch
      DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@')
      DEFAULT_BRANCH=${DEFAULT_BRANCH:-main}
      git checkout $DEFAULT_BRANCH --quiet

      # 2. Only pull if an 'origin' remote is configured
      if git remote | grep -q 'origin'; then
        git pull --ff-only
      else
        echo "Local-only repo ($REPO_NAME): skipped network pull."
      fi

      # 3. Register base repo to Gita using file lock. The group is namespaced by the
      # workspace folder (parent of the repo) so each workspace gets its own
      # "<workspace>-reference" group instead of sharing one global "reference". Gita groups take
      # repo names, and `gita add -g` skips repos it already knows, so add first, then look the
      # name up from the path.
      WORKSPACE="$(basename "$(dirname "$PWD")")"
      ABS_DIR="$(pwd -P)"
      (
        flock -x 200
        gita add "$ABS_DIR" >/dev/null 2>&1
        for NAME in $(gita ls); do
          if [ "$(gita ls "$NAME")" = "$ABS_DIR" ]; then
            gita group add -n "${WORKSPACE}-reference" "$NAME" >/dev/null
            break
          fi
        done
      ) 200>/tmp/gita-mani.lock

  create-work:
    desc: "Spin up Work/Work-{workspace}-{slug} environment across ALL repos and set upstream"
    spec:
      parallel: true
    cmd: |
      SLUG="${slug:?Specify slug, e.g. mani run create-work slug=jira-101}"
      REPO_NAME="$(basename "$PWD")"
      # Qualified by workspace: Gita names a worktree by its last two path parts, so this keeps
      # same-named repos in different workspaces from colliding in Gita.
      WORKSPACE="$(basename "$(dirname "$PWD")")"
      WORK_DIR="./Work/Work-${WORKSPACE}-${SLUG}/${REPO_NAME}"

      # Create new branch or fallback to restoring an existing one
      if git worktree add -b "$SLUG" "$WORK_DIR" main 2>/dev/null || git worktree add -b "$SLUG" "$WORK_DIR" master 2>/dev/null; then
        # If it's a NEW branch, immediately set upstream tracking if 'origin' exists
        if git remote | grep -q 'origin'; then
          git -C "$WORK_DIR" push -u origin "$SLUG" >/dev/null 2>&1 || echo "⚠️ [$REPO_NAME]: Initial upstream push skipped (repo might be empty)."
        fi
      else
        # Fallback to creating worktree for an already existing branch
        git worktree add "$WORK_DIR" "$SLUG" 2>/dev/null
      fi

      # Register with Gita safely using a file lock. The group is "<workspace>-<slug>" (workspace =
      # parent folder of the repo) so the same ticket slug in two workspaces stays separate.
      # Gita groups take repo names (a worktree is named by its path, e.g. Work-T-1/repo), so add
      # first, then look the name up from the path.
      if [ ! -d "$WORK_DIR" ]; then
        echo "❌ [$REPO_NAME]: worktree '$WORK_DIR' was not created; skipped Gita registration."
        exit 1
      fi
      ABS_DIR="$(cd "$WORK_DIR" && pwd -P)"
      (
        flock -x 200
        gita add "$ABS_DIR" >/dev/null 2>&1
        for NAME in $(gita ls); do
          if [ "$(gita ls "$NAME")" = "$ABS_DIR" ]; then
            gita group add -n "${WORKSPACE}-${SLUG}" "$NAME" >/dev/null
            break
          fi
        done
      ) 200>/tmp/gita-mani.lock

  pull-work:
    desc: "Pull upstream changes into worktree (fast-forward only)"
    spec:
      parallel: true
    cmd: |
      SLUG="${slug:?Specify slug}"
      REPO_NAME="$(basename "$PWD")"
      # Qualified by workspace: Gita names a worktree by its last two path parts, so this keeps
      # same-named repos in different workspaces from colliding in Gita.
      WORKSPACE="$(basename "$(dirname "$PWD")")"
      WORK_DIR="./Work/Work-${WORKSPACE}-${SLUG}/${REPO_NAME}"

      if [ ! -d "$WORK_DIR" ]; then exit 0; fi

      echo "⬇️  [$REPO_NAME]: Pulling --ff-only..."
      git -C "$WORK_DIR" pull --ff-only

  push-work:
    desc: "Push worktree changes to upstream remote"
    spec:
      parallel: true
    cmd: |
      SLUG="${slug:?Specify slug}"
      REPO_NAME="$(basename "$PWD")"
      # Qualified by workspace: Gita names a worktree by its last two path parts, so this keeps
      # same-named repos in different workspaces from colliding in Gita.
      WORKSPACE="$(basename "$(dirname "$PWD")")"
      WORK_DIR="./Work/Work-${WORKSPACE}-${SLUG}/${REPO_NAME}"

      if [ ! -d "$WORK_DIR" ]; then exit 0; fi

      echo "⬆️  [$REPO_NAME]: Pushing to remote..."
      git -C "$WORK_DIR" push

  rebase-work:
    desc: "Rebase worktree branch against the local default branch (main/master)"
    # Not parallel on purpose, so rebase conflicts don't mangle terminal output.
    cmd: |
      SLUG="${slug:?Specify slug}"
      REPO_NAME="$(basename "$PWD")"
      # Qualified by workspace: Gita names a worktree by its last two path parts, so this keeps
      # same-named repos in different workspaces from colliding in Gita.
      WORKSPACE="$(basename "$(dirname "$PWD")")"
      WORK_DIR="./Work/Work-${WORKSPACE}-${SLUG}/${REPO_NAME}"

      if [ ! -d "$WORK_DIR" ]; then exit 0; fi

      # Determine the default branch for this specific repo
      DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@')
      DEFAULT_BRANCH=${DEFAULT_BRANCH:-main}

      echo "🔄 [$REPO_NAME]: Rebasing onto $DEFAULT_BRANCH..."
      git -C "$WORK_DIR" rebase "$DEFAULT_BRANCH" || {
        echo "❌ [$REPO_NAME]: Rebase conflict! Halting."
        echo "💡 Go to $WORK_DIR and run 'git rebase --continue' or 'git rebase --abort'."
        exit 1
      }

  clean-work:
    desc: "Safely remove worktrees (skips dirty/unpushed repos, parallel execution)"
    spec:
      parallel: true
    cmd: |
      SLUG="${slug:?Specify slug to remove, e.g. mani run clean-work slug=jira-101}"
      REPO_NAME="$(basename "$PWD")"
      # Qualified by workspace: Gita names a worktree by its last two path parts, so this keeps
      # same-named repos in different workspaces from colliding in Gita.
      WORKSPACE="$(basename "$(dirname "$PWD")")"
      WORK_DIR="./Work/Work-${WORKSPACE}-${SLUG}/${REPO_NAME}"

      if [ ! -d "$WORK_DIR" ]; then exit 0; fi

      fail_and_advise() {
        echo "❌ [$REPO_NAME]: $1"
        echo "💡 To restore removed worktrees for this slug, run: mani run create-work slug=$SLUG"
        exit 1
      }

      # 1. Check for uncommitted changes
      if [ -n "$(git -C "$WORK_DIR" status --porcelain)" ]; then
        fail_and_advise "Uncommitted changes in '$WORK_DIR'."
      fi

      # 2. Check if branch has an upstream
      BRANCH=$(git -C "$WORK_DIR" rev-parse --abbrev-ref HEAD)
      UPSTREAM=$(git -C "$WORK_DIR" rev-parse --abbrev-ref @{upstream} 2>/dev/null)

      if [ -z "$UPSTREAM" ]; then
        fail_and_advise "Branch '$BRANCH' has no remote upstream."
      fi

      # 3. Check if local branch is ahead of remote
      AHEAD=$(git -C "$WORK_DIR" rev-list --left-right --count HEAD...$UPSTREAM 2>/dev/null | awk '{print $1}')
      if [ "$AHEAD" -gt 0 ]; then
        fail_and_advise "Branch '$BRANCH' is ahead of remote by $AHEAD commits."
      fi

      # Unregister from Gita first: it hides repos whose folder is gone, so they can't be removed
      # afterwards. `gita rm` also drops the repo from every group (and empty groups). If git then
      # refuses to remove the worktree, register it again.
      ABS_DIR="$(cd "$WORK_DIR" && pwd -P)"
      ( flock -x 200
        for NAME in $(gita ls); do
          if [ "$(gita ls "$NAME")" = "$ABS_DIR" ]; then gita rm "$NAME" >/dev/null 2>&1; break; fi
        done
      ) 200>/tmp/gita-mani.lock

      if ! git worktree remove "$WORK_DIR" 2>/dev/null; then
        ( flock -x 200
          gita add "$ABS_DIR" >/dev/null 2>&1
          for NAME in $(gita ls); do
            if [ "$(gita ls "$NAME")" = "$ABS_DIR" ]; then gita group add -n "${WORKSPACE}-${SLUG}" "$NAME" >/dev/null; break; fi
          done
        ) 200>/tmp/gita-mani.lock
        fail_and_advise "Git blocked removal."
      fi

      echo "✅ [$REPO_NAME]: Cleaned successfully."

  clean-work-forced:
    desc: "Force remove worktree environment and clean up Gita (DESTROYS UNPUSHED WORK)"
    spec:
      parallel: true
    cmd: |
      SLUG="${slug:?Specify slug}"
      REPO_NAME="$(basename "$PWD")"
      # Qualified by workspace: Gita names a worktree by its last two path parts, so this keeps
      # same-named repos in different workspaces from colliding in Gita.
      WORKSPACE="$(basename "$(dirname "$PWD")")"
      WORK_DIR="./Work/Work-${WORKSPACE}-${SLUG}/${REPO_NAME}"

      if [ ! -d "$WORK_DIR" ]; then exit 0; fi

      # Unregister from Gita before the folder disappears (see clean-work).
      ABS_DIR="$(cd "$WORK_DIR" && pwd -P)"
      ( flock -x 200
        for NAME in $(gita ls); do
          if [ "$(gita ls "$NAME")" = "$ABS_DIR" ]; then gita rm "$NAME" >/dev/null 2>&1; break; fi
        done
      ) 200>/tmp/gita-mani.lock

      git worktree remove "$WORK_DIR" --force 2>/dev/null || true

      echo "⚠️  [$REPO_NAME]: Forcefully removed."
