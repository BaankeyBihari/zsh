# Keychain token map: ENV_NAME -> macOS keychain service (account is $USER).
# Names only, never values. Installed to ~/.config/tokens/map.yaml by bin/install.sh.
#
# managed: everything down to the `unmanaged:` line is rewritten from the repo on every
# install. Do not edit it in ~/.config/tokens/map.yaml.
# Entry forms (2-space indent): `NAME: service`, or nested `service:` + optional `validator:`
# (shell command or script, exit 0 = good; run by `tokens validate`, never at shell start).
managed:
  HF_TOKEN:
    service: hf-access-token
    validator: curl -fsS --max-time 10 -o /dev/null -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2
  BWS_ACCESS_TOKEN:
    service: bws-access-token
    validator: bws project list --output none
  LOCALSTACK_AUTH_TOKEN: localstack-auth-token

# unmanaged: yours. install.sh keeps this section (and anything after it) byte-for-byte.
# An entry here overrides a managed one with the same ENV_NAME.
