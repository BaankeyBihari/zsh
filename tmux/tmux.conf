# tmux status bar — managed in the zsh repo, installed to ~/.config/tmux/tmux.conf.
# Theme: catppuccin-mocha, matching starship/starship.toml. Glyphs are Nerd Font
# codepoints (font-meslo-lg-nerd-font); swap one by editing its \uXXXX-equivalent char.
# Logo comes from the session-name prefix set by _tmux_attach_or_run
# (config/80-functions.zsh): claude-* / codex-* / agy-*, else a generic terminal glyph.

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#181825,fg=#cdd6f4'

set -g status-left-length 40
set -g status-right-length 60

# left: [logo session]  — logo colored per agent
set -g status-left '#[bg=#313244]#{?#{m:claude-*,#{session_name}},#[fg=#fab387],#{?#{m:codex-*,#{session_name}},#[fg=#a6e3a1],#{?#{m:agy-*,#{session_name}},#[fg=#89b4fa],#[fg=#cba6f7]}}} #[fg=#cdd6f4]#S #[bg=#181825] '

# window list
set -g window-status-format '#[fg=#6c7086]#I:#W'
set -g window-status-current-format '#[fg=#cba6f7]#I:#W'
set -g window-status-separator '  '

# right: git branch of the active pane, then clock
set -g status-right '#[fg=#6c7086]#(git -C "#{pane_current_path}" branch --show-current 2>/dev/null | sed "s/^./  &/") #[fg=#cdd6f4]%H:%M '

# mouse: click/drag-resize panes, click windows in the status bar, wheel scrolls
# (enters copy-mode), double/triple-click selects word/line. Hold Shift (Option in
# iTerm2/Ghostty) to bypass tmux for native terminal selection.
set -g mouse on
set -g focus-events on     # pass focus in/out to apps (nvim autoread, etc.)
set -g set-clipboard on    # OSC 52: tmux copies reach the macOS clipboard
# drag-select copies to the clipboard and stays in copy-mode (default exits it)
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear pbcopy

# splits: new pane starts in the current pane's directory. Ghostty's cmd+d>s / cmd+d>v
# send prefix + | / - (ghostty/config.ghostty); defaults kept for E (spread evenly),
# z (zoom) and prefix+arrows (select-pane).
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#cba6f7'
set -g message-style 'bg=#313244,fg=#cdd6f4'
